<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calculo de compras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <div class="card">
        <h2>Calculo de compras</h2>
        <form method="POST">
            <div class="form-group">
                <label for="nombre">Ingresa tu nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="edad">Ingresa tu edad</label>
                <input type="number" id="edad" name="edad" min="0" required>
            </div>
            <div class="form-group">
                <label for="cantidad">Ingresa la cantidad de tarros de pintura a comprar</label>
                <input type="number" id="cantidad" name="cantidad" min="1" required>
            </div>
            <button type="submit" class="btn-enviar">Calcular</button>
        </form>

        {% if total_sin_descuento is not none %}
            <div class="resultado">
                <p>Nombre del cliente: {{ nombre }}</p>
                <p>Total sin descuento: ${{ total_sin_descuento }}</p>
                <p>El descuento es : ${{ descuento }}</p>
                <p>El total a pagar es de : ${{ total_a_pagar }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
